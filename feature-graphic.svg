<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-labelledby="title description">
  <title id="title">Dodge &amp; Catch</title>
  <desc id="description">Gráfico arcade neón de Dodge &amp; Catch con esferas, bloques rojos y gemas.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d27"/>
      <stop offset=".52" stop-color="#11102d"/>
      <stop offset="1" stop-color="#260b31"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2=".15">
      <stop offset="0" stop-color="#7ce8ff"/>
      <stop offset=".48" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#ff78be"/>
    </linearGradient>
    <linearGradient id="blueOrb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8af1ff"/>
      <stop offset=".42" stop-color="#35baff"/>
      <stop offset="1" stop-color="#2361ff"/>
    </linearGradient>
    <linearGradient id="pinkOrb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb1d8"/>
      <stop offset=".48" stop-color="#ff4caa"/>
      <stop offset="1" stop-color="#a920e0"/>
    </linearGradient>
    <linearGradient id="redBlock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff777c"/>
      <stop offset="1" stop-color="#ed214d"/>
    </linearGradient>
    <radialGradient id="centerGlow">
      <stop offset="0" stop-color="#3a52c6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#3a52c6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#b9d8ff" stroke-opacity=".035"/>
    </pattern>
    <filter id="glowBlue" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPink" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGold" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#background)"/>
  <ellipse cx="512" cy="225" rx="410" ry="270" fill="url(#centerGlow)"/>

  <g fill="none" stroke="#667bff" stroke-opacity=".14">
    <path d="M0 410H1024M0 450H1024M0 490H1024"/>
    <path d="M512 330 50 500M512 330 210 500M512 330 360 500M512 330 664 500M512 330 814 500M512 330 974 500"/>
  </g>
  <path d="M0 352H1024" stroke="#56c9ff" stroke-opacity=".16"/>
  <path d="M28 0V500M996 0V500" stroke="#7f7cff" stroke-opacity=".12"/>
  <rect width="1024" height="500" fill="url(#scanlines)"/>

  <g fill="#b9d7ff" opacity=".72">
    <circle cx="75" cy="94" r="2"/><circle cx="111" cy="180" r="1.5"/>
    <circle cx="165" cy="74" r="1.5"/><circle cx="249" cy="119" r="2"/>
    <circle cx="343" cy="64" r="1.5"/><circle cx="706" cy="73" r="1.5"/>
    <circle cx="788" cy="122" r="2"/><circle cx="872" cy="76" r="1.5"/>
    <circle cx="950" cy="181" r="2"/><circle cx="918" cy="286" r="1.5"/>
    <circle cx="84" cy="300" r="1.5"/><circle cx="940" cy="408" r="1.5"/>
  </g>

  <g opacity=".72" fill="none" stroke="#42c9ff" stroke-linecap="round">
    <path d="M62 256H134" stroke-width="3" stroke-opacity=".42"/>
    <path d="M44 270H115" stroke-width="2" stroke-opacity=".25"/>
    <path d="M891 226H965" stroke-width="3" stroke-opacity=".4"/>
    <path d="M909 240H980" stroke-width="2" stroke-opacity=".24"/>
  </g>

  <g filter="url(#glowBlue)">
    <circle cx="152" cy="250" r="47" fill="#2bbcff" fill-opacity=".18" stroke="#68e5ff" stroke-width="4"/>
    <circle cx="152" cy="250" r="34" fill="url(#blueOrb)"/>
    <ellipse cx="141" cy="237" rx="11" ry="7" fill="#e0fcff" opacity=".66"/>
  </g>
  <g filter="url(#glowPink)">
    <circle cx="872" cy="250" r="47" fill="#ff4ca8" fill-opacity=".18" stroke="#ff83c3" stroke-width="4"/>
    <circle cx="872" cy="250" r="34" fill="url(#pinkOrb)"/>
    <ellipse cx="861" cy="237" rx="11" ry="7" fill="#fff0f7" opacity=".66"/>
  </g>

  <g filter="url(#glowGold)">
    <path d="m278 154 19 19-19 19-19-19z" fill="#ffd94e" stroke="#fff1a5" stroke-width="2"/>
    <path d="m746 131 15 15-15 15-15-15z" fill="#ffd94e" stroke="#fff1a5" stroke-width="2"/>
  </g>

  <g filter="url(#glowPink)">
    <rect x="266" y="332" width="39" height="39" rx="5" fill="url(#redBlock)" stroke="#ff9aa0" stroke-width="2" transform="rotate(12 285.5 351.5)"/>
    <rect x="719" y="346" width="35" height="35" rx="5" fill="url(#redBlock)" stroke="#ff9aa0" stroke-width="2" transform="rotate(-11 736.5 363.5)"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="512" y="194" fill="#63caff" opacity=".28" font-size="79" font-weight="900" letter-spacing="6">DODGE</text>
    <text x="512" y="188" fill="url(#titleGradient)" font-size="79" font-weight="900" letter-spacing="6">DODGE</text>
    <text x="512" y="282" fill="#ff59b6" opacity=".25" font-size="75" font-weight="900" letter-spacing="5">&amp; CATCH</text>
    <text x="512" y="276" fill="#ff70b7" font-size="75" font-weight="900" letter-spacing="5">&amp; CATCH</text>
    <text x="512" y="323" fill="#c5d1f2" font-size="17" font-weight="700" letter-spacing="5">ESQUIVA · ATRAPA · SOBREVIVE</text>
  </g>

  <g fill="none" stroke-width="2">
    <path d="M40 34H180M40 34V74M984 34H844M984 34V74" stroke="#54cfff" stroke-opacity=".7"/>
    <path d="M40 466H180M40 466V426M984 466H844M984 466V426" stroke="#ff63b4" stroke-opacity=".58"/>
  </g>
</svg>
