name: Compilar Android (.aab) - DodgeAndCatch

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Instalar dependencias con pnpm
        run: pnpm install --no-frozen-lockfile

      - name: Compilar la app Web (DodgeAndCatch)
        env:
          PORT: 5000
          BASE_PATH: '/'
          NODE_ENV: 'production'
        run: pnpm build || true

      - name: Preparar carpeta dist e Inicializar Capacitor
        run: |
          mkdir -p dist
          if [ -d "public" ]; then cp -r public/* dist/ 2>/dev/null || true; fi
          if [ -f "index.html" ]; then cp index.html dist/; fi
          
          if [ ! -d "android" ]; then
            pnpm exec cap init DodgeAndCatch com.dodgeandcatch.app --web-dir dist
            pnpm exec cap add android
          fi
          pnpm exec cap sync android

      - name: Configurar AdMob e Incrementar Versión Dinámicamente
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          ADMOB_APP_ID="ca-app-pub-9984763727647656~8985067364"
          
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
              sed -i "/<\/application>/i \        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/>" $MANIFEST
            fi
          fi

          BUILD_NUMBER=${{ github.run_number }}
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i "s/versionCode 1/versionCode $BUILD_NUMBER/g" $GRADLE_FILE
            sed -i "s/versionName \"1.0\"/versionName \"1.$BUILD_NUMBER\"/g" $GRADLE_FILE
          fi

      - name: Decodificar Keystore de Firma guardado
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cd android
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Compilar AAB y Firmar
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew bundleRelease
          
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass "$STORE_PASS" app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"

      - name: Subir Artifact (.aab firmado)
        uses: actions/upload-artifact@v4
        with:
          name: DodgeAndCatch-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
